<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            width: 320px;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #0078d4;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #005ea6;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="login-box">
        <h2>Đăng nhập</h2>

        <div class="form-group">
            <input type="text" id="username" placeholder="Tên đăng nhập">
        </div>

        <div class="form-group">
            <input type="password" id="password" placeholder="Mật khẩu">
        </div>

        <button onclick="login()">Đăng nhập</button>

        <div id="message" class="error"></div>
    </div>

    <script>
        function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // Demo tài khoản
            if (username === "nhungle" && password === "298271") {
                window.parent.location.href = "tools/chamcong/ktchamcong.html";
            } else {
                document.getElementById("message").innerText =
                    "Sai tên đăng nhập hoặc mật khẩu";
            }
        }
    </script>

</body>

</html>
